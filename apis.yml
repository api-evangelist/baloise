aid: baloise

name: Baloise

description: Baloise Group is a Basel, Switzerland-based insurance and pension group (GitHub org 'Baloise Group', Aeschengraben 21, 4002 Basel)
  that publishes open-source work through its baloise and baloise-incubator GitHub organizations. Its API-related open source includes a custom
  Spectral API linter ruleset for the Zalando RESTful API Guidelines, the Corellia B2B Web-API specification for insurance contract data, the
  GitOps CLI and the Baloise Design System. Its former website, www.baloise.com, now redirects to the Helvetia Baloise Group corporate site (helvetia-baloise.com)
  following the Helvetia-Baloise merger.

